# @file patina-qemu-pr-validation.yml
#
# A workflow that runs QEMU-based validation after CI succeeds for a pull
# request. This validates that the PR changes to patina-dxe-core-qemu still
# produce a firmware image that boots successfully on QEMU, and compares EFI
# binary sizes against the PR's target branch.
#
# Copyright (c) Microsoft Corporation.
# SPDX-License-Identifier: Apache-2.0
##
name: CI

on:
  pull_request:
    branches: [test/size-migration-base-20261026]
  workflow_dispatch:
    inputs:
      triggering-run-id:
        description: "Completed fork producer run ID"
        required: true
        type: string

# Do not allow more than one instance of this workflow to run at the same
# time for the same PR branch.
concurrency:
  group: qemu-pr-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    name: Gather Incoming PR Metadata
    if: github.event_name == 'pull_request'
    outputs:
      pr_number: ${{ steps.pr-info.outputs.pr_number }}
      base_ref: ${{ steps.pr-info.outputs.base_ref }}
      skip: ${{ steps.pr-info.outputs.skip }}
      skip_reason: ${{ steps.pr-info.outputs.skip_reason }}
    steps:
      - name: Get PR Information
        id: pr-info
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          owner="${HEAD_REPO%%/*}"

          pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls" \
            --method GET -f state=open -f head="${owner}:${HEAD_REF}" \
            --jq '.[0]')
          pr_number=$(echo "$pr_json" | jq -r '.number // empty')

          if [[ -z "$pr_number" || "$pr_number" == "null" ]]; then
            echo "::notice::No open PR found for head $owner:$HEAD_REF. Checking for closed/merged PRs."
            echo "skip=true" >> "$GITHUB_OUTPUT"

            closed_pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls" \
              --method GET -f state=closed -f head="${owner}:${HEAD_REF}" \
              -f sort=updated -f direction=desc -f per_page=1 \
              --jq '.[0] | select(. != null) | {number, merged: (.merged_at != null)}')

            if [[ -n "$closed_pr_json" ]]; then
              closed_pr_number=$(echo "$closed_pr_json" | jq -r '.number')
              closed_pr_merged=$(echo "$closed_pr_json" | jq -r '.merged')

              echo "pr_number=$closed_pr_number" >> "$GITHUB_OUTPUT"

              if [[ "$closed_pr_merged" == "true" ]]; then
                echo "::notice::PR #$closed_pr_number was merged before validation started."
                echo "skip_reason=merged" >> "$GITHUB_OUTPUT"
              else
                echo "::notice::PR #$closed_pr_number was closed before validation started."
                echo "skip_reason=closed" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "::notice::No PR (open or closed) found for head $owner:$HEAD_REF."
              echo "skip_reason=branch_unavailable" >> "$GITHUB_OUTPUT"
            fi

            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

          echo "::group::PR Information"
          echo "  - PR Number: $pr_number"
          echo "  - Head SHA:  $HEAD_SHA"
          echo "  - Head Ref:  $HEAD_REF"
          echo "  - Source:    $HEAD_REPO"
          echo "::endgroup::"

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          base_ref=$(echo "$pr_json" | jq -er '.base.ref')
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"

  upload-skip-metadata:
    name: Upload Skip Metadata
    runs-on: ubuntu-latest
    needs: [prepare]
    if: needs.prepare.outputs.skip == 'true' && needs.prepare.outputs.pr_number != ''
    steps:
      - name: Create Skip Metadata
        shell: bash
        run: |
          mkdir -p metadata
          cat > metadata/pr-metadata.json <<EOF
          {
            "pr_number": ${{ needs.prepare.outputs.pr_number }},
            "skipped": true,
            "skip_reason": "${{ needs.prepare.outputs.skip_reason }}"
          }
          EOF

      - name: Upload PR Metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patina-qemu-pr-metadata
          path: metadata/pr-metadata.json

  qemu-pr-validation:
    name: Run Patina QEMU Validation
    needs: [prepare]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/fork-size-producer.yml
    with:
      dxe-core-qemu-ref: ${{ github.event.pull_request.head.sha }}
      base-ref: ${{ needs.prepare.outputs.base_ref }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      pr-number: ${{ fromJSON(needs.prepare.outputs.pr_number) }}
    secrets: inherit

  publish-test-results:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/fork-size-publisher.yml
    with:
      triggering-run-id: ${{ fromJSON(inputs.triggering-run-id) }}
    secrets: inherit
